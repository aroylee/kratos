[project]
name = "kratos"
version = "0.1.0"
description = "Sovereign multi-engine conversational data intelligence & governance framework with formal DataTask contracts, 4-layer AST SQL guard, and unit-aware executive analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "sqlglot>=25.20.0",
    "duckdb>=1.1.0",
    "litellm>=1.50.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
kratos = "kratos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kratos"]

